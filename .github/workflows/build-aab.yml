name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/geolocation

      - name: Build Web Assets
        run: npm run build

      - name: Setup Java JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Capacitor & Add Android
        run: |
          npx cap init "سارق الظلال" "com.shadowthief.game" --web-dir dist
          npx cap add android

      - name: Update App Name & Icon
        run: |
          # تحديث اسم التطبيق
          sed -i 's/android:label=".*"/android:label="سارق الظلال"/' android/app/src/main/AndroidManifest.xml || true
          sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">سارق الظلال<\/string>/' android/app/src/main/res/values/strings.xml || true
          sed -i 's/<string name="title_activity_main">.*<\/string>/<string name="title_activity_main">سارق الظلال<\/string>/' android/app/src/main/res/values/strings.xml || true

          # إنشاء لوغو قناع السارق 🥷 تلقائياً
          sudo apt-get update && sudo apt-get install -y imagemagick
          convert -size 512x512 xc:'#0d1117' \
            -fill '#1f6feb' -draw "circle 256,256 256,50" \
            -fill '#ffffff' -font DejaVu-Sans-Bold -pointsize 200 -gravity center -annotate +0-10 "🥷" \
            icon.png

          # توزيع اللوغو الجديد على أندرويد
          for res in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            mkdir -p android/app/src/main/res/$res
            cp icon.png android/app/src/main/res/$res/ic_launcher.png
            cp icon.png android/app/src/main/res/$res/ic_launcher_round.png
            cp icon.png android/app/src/main/res/$res/ic_launcher_foreground.png
          done

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
