name: Build Android APK & AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps
          npm install @capacitor/cli @capacitor/core @capacitor/android --legacy-peer-deps

      - name: Create Capacitor Config if missing
        run: |
          if [ ! -f "capacitor.config.json" ] && [ ! -f "capacitor.config.ts" ]; then
            echo '{"appId": "com.beatnote.app", "appName": "BEAT & NOTE", "webDir": "dist"}' > capacitor.config.json
          fi

      - name: Build Web App
        run: |
          npm run build

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Add Android Platform & Sync
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Fix Kotlin Duplicate Class Conflict & Configuration
        run: |
          # Fix Kotlin Duplicate Classes Conflict in root build.gradle
          if [ -f "android/build.gradle" ]; then
            echo 'allprojects { configurations.all { resolutionStrategy.eachDependency { DependencyResolveDetails details -> if (details.requested.group == "org.jetbrains.kotlin") { details.useVersion "1.8.22" } } } }' >> android/build.gradle
          fi

          # 1. Update App Name in Android Strings
          sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">BEAT \&amp; NOTE<\/string>/g' android/app/src/main/res/values/strings.xml || true
          sed -i 's/<string name="title_activity_main">.*<\/string>/<string name="title_activity_main">BEAT \&amp; NOTE<\/string>/g' android/app/src/main/res/values/strings.xml || true

          # 2. Update Android Manifest Label
          sed -i 's/android:label="[^"]*"/android:label="BEAT \&amp; NOTE"/g' android/app/src/main/AndroidManifest.xml || true

          # 3. Create Modern Purple Music Logo Icon
          sudo apt-get install -y imagemagick
          mkdir -p icon_temp
          
          convert -size 512x512 radial-gradient:'#7C3AED'-'#4C1D95' \
            -fill white -font DejaVu-Sans-Bold -pointsize 260 -gravity center -draw "text 0,-10 '🎵'" \
            icon_temp/icon.png

          # Generate Mipmap Icons
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi

          convert icon_temp/icon.png -resize 48x48 android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          convert icon_temp/icon.png -resize 72x72 android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert icon_temp/icon.png -resize 96x96 android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert icon_temp/icon.png -resize 144x144 android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert icon_temp/icon.png -resize 192x192 android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

          convert icon_temp/icon.png -resize 48x48 android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
          convert icon_temp/icon.png -resize 72x72 android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          convert icon_temp/icon.png -resize 96x96 android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
          convert icon_temp/icon.png -resize 144x144 android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
          convert icon_temp/icon.png -resize 192x192 android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Build Android Release AAB
        run: |
          cd android
          ./gradlew bundleRelease --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BEAT-NOTE-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BEAT-NOTE-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
          
