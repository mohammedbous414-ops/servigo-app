import React, { useState, useEffect } from 'react';
import { Geolocation } from '@capacitor/geolocation';

export default function App() {
  const [city, setCity] = useState<string>('جاري تحديد مدينتك...');
  const [loading, setLoading] = useState<boolean>(true);
  const [errorMsg, setErrorMsg] = useState<string | null>(null);

  useEffect(() => {
    getCurrentLocation();
  }, []);

  const getCurrentLocation = async () => {
    try {
      setLoading(true);
      setErrorMsg(null);

      // طلب الإذن والحصول على إحداثيات الـ GPS
      const coordinates = await Geolocation.getCurrentPosition({
        enableHighAccuracy: true,
        timeout: 10000,
      });

      const { latitude, longitude } = coordinates.coords;

      // تحويل الإحداثيات إلى اسم المدينة بالعربية عبر API مجاني (Reverse Geocoding)
      const response = await fetch(
        `https://nominatim.openstreetmap.org/reverse?format=json&lat=${latitude}&lon=${longitude}&accept-language=ar`
      );
      const data = await response.json();

      if (data && data.address) {
        // البحث عن اسم المدينة أو الإقليم أو المنطقة
        const detectedCity =
          data.address.city ||
          data.address.town ||
          data.address.village ||
          data.address.state ||
          'مدينة غير معروفة';

        setCity(detectedCity);
      } else {
        setCity('المغرب');
      }
    } catch (error) {
      console.error('Error fetching location:', error);
      setErrorMsg('تعذر الحصول على الموقع التلقائي');
      setCity('الدار البيضاء'); // مدينة افتراضية في حالة إلغاء الـ GPS
    } finally {
      setLoading(false);
    }
  };

  return (
    <div style={{ padding: '20px', fontFamily: 'sans-serif', textAlign: 'center', direction: 'rtl' }}>
      {/* هيدر التطبيق مع عرض المدينة التلقائية */}
      <header style={{ background: '#0f172a', color: '#fff', padding: '15px', borderRadius: '12px' }}>
        <h1 style={{ margin: 0, color: '#f59e0b' }}>كِايْنْ؟</h1>
        <p style={{ margin: '8px 0 0 0', fontSize: '14px', color: '#cbd5e1' }}>
          📍 مدينتك الحالية: <strong style={{ color: '#f59e0b' }}>{city}</strong>
        </p>
      </header>

      {/* محتوى الشاشة */}
      <main style={{ marginTop: '30px' }}>
        {loading ? (
          <p>⏳ جاري تحديد موقعك عبر الـ GPS...</p>
        ) : (
          <div>
            <h3>مرحباً بك في {city}! 👋</h3>
            <p>هنا ستظهر كل الخدمات والمنتجات المتوفرة حالياً في مدينتك.</p>
            {errorMsg && (
              <button
                onClick={getCurrentLocation}
                style={{
                  padding: '8px 16px',
                  backgroundColor: '#f59e0b',
                  border: 'none',
                  borderRadius: '6px',
                  fontWeight: 'bold',
                  cursor: 'pointer',
                }}
              >
                🔄 إعادة التحديث
              </button>
            )}
          </div>
        )}
      </main>
    </div>
  );
}

